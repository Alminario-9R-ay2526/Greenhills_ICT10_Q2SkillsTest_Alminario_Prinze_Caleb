<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <title>Non-Metal Elements Finder</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #1e293b;
            max-width: 480px;
            margin: 50px auto;
            padding: 28px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            color: #0284c7;
            margin-top: 0;
            margin-bottom: 4px;
            text-align: center;
        }

        p {
            margin-top: 4px;
            color: #475569;
            text-align: center;
        }

        label {
            font-weight: 600;
            color: #334155;
            display: inline-block;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1.5px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            text-align: center;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #0284c7;
            background-color: #ffffff;
        }

        button {
            width: 100%;
            background-color: #0284c7;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease;
            text-align: center;
        }

        button:hover {
            background-color: #0369a1;
        }

        #result_output {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 6px;
            background-color: #f1f5f9;
            border-left: 4px solid #0284c7;
            min-height: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Non-Metal Elements</h2>
    <p>Periodic Table Information Finder</p>
    
    <p><strong>Instructions:</strong> Enter the symbol of a non-metal element (Example: H, O, Cl, Ne, Xe).</p>

    <label for="symbol_input">Element Symbol:</label><br>
    <input type="text" id="symbol_input" placeholder="Enter symbol"><br><br>

    <button type="submit" py-click="check_details">Checking Details</button>

    <div id="result_output"></div>

    <script type="py" src="main.py"></script>

</body>
</html>
